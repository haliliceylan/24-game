<!doctype html>
<html lang="und">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>24 Kart Pratiği</title>
<style>
  /* layout: one screen — clock and score on top, cards in the middle, solution steps, round buttons at the bottom */
  :root { --bg: #e7eee8; --fg: #17211b; --card: #fffdf8; --card-fg: #1a1d1b; --extra: #dbe6ff;
          --line: #7c877f80; --ok: #17804f; --hint: #e07f00; --gap: 2.5vw; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #101b15; --fg: #e4ece6; --card: #f4f1e8; --extra: #c9d8ff; --ok: #45c98b; --hint: #ffae2b; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #101b15; --fg: #e4ece6; --card: #f4f1e8; --extra: #c9d8ff; --ok: #45c98b; --hint: #ffae2b; color-scheme: dark }
  * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px;
         padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
                  max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
         font: 600 22px system-ui, -apple-system, sans-serif; font-variant-numeric: tabular-nums;
         background: var(--bg); color: var(--fg); user-select: none; -webkit-user-select: none; }
  header, footer { width: 100%; max-width: 640px; display: flex; justify-content: space-between; }
  /* card size comes from --w only (no aspect-ratio / dvh dependence, so old phone browsers lay out the same) */
  #cards { flex: 1; min-height: 0; display: flex; gap: 2.5vw; justify-content: center; align-items: center;
           align-content: center; --w: min(16.5vw, 110px); }
  .card { position: relative; width: var(--w); height: calc(var(--w) * 1.4); padding: 0; margin: 0; border-radius: 10px;
          border: 2px solid var(--line); background: var(--card); color: var(--card-fg);
          font: 700 calc(var(--w) * .5) system-ui, -apple-system, sans-serif; cursor: pointer; transition: transform .1s; }
  #cards.sq { display: grid; grid-template-columns: repeat(2, auto); gap: 14px; --w: min(38vw, 17vh, 190px); }
  #cards.sq.five { grid-template-columns: repeat(6, auto); --w: min(28vw, 17vh, 190px); }
  #cards.sq.five .card { grid-column: span 2; }
  #cards.sq.five .card:nth-child(4) { grid-column: 2 / span 2; }
  #cards.col { flex-direction: column; gap: 10px; }
  #cards.col .card { width: min(64vw, 300px); height: min(10vh, 110px); font-size: min(6.5vh, 60px); }
  .card.extra { background: var(--extra); }
  .card.on { transform: translateY(-8px); border-color: var(--ok); box-shadow: 0 0 0 4px var(--ok); }
  .card.hint { border-color: var(--hint); box-shadow: 0 0 0 6px var(--hint); }
  .card i { position: absolute; top: 4px; right: 8px; font: 700 18px system-ui, -apple-system, sans-serif; color: #17804f; }
  #cards.no { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-10px) } 75% { transform: translateX(10px) } }
  #steps { min-height: 4.2em; text-align: center; font-size: 22px; line-height: 1.4; }
  #steps.win { color: var(--ok); }
  .f sup, .f sub { font-size: .7em; }
  footer button { font-size: 30px; line-height: 1; width: 64px; height: 64px; padding: 0; border-radius: 50%;
                  border: 2px solid var(--line); background: none; color: inherit; cursor: pointer; }
</style>
<header><span id="time"></span><span id="score"></span></header>
<main id="cards"></main>
<section id="steps"></section>
<footer><button id="undo">↶</button><button id="layout">⊞</button><button id="skip">»</button></footer>
<script>
// ---------- logic (exact fractions as [numerator, denominator]) ----------
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const fr = (n, d = 1) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; return [n / g, d / g]; };
const OPS = [
  ['+', (a, b) => fr(a[0] * b[1] + b[0] * a[1], a[1] * b[1])],
  ['−', (a, b) => fr(a[0] * b[1] - b[0] * a[1], a[1] * b[1])],
  ['×', (a, b) => fr(a[0] * b[0], a[1] * b[1])],
  ['÷', (a, b) => b[0] ? fr(a[0] * b[1], a[1] * b[0]) : null],
];
const fmt = ([n, d]) => (n < 0 ? '−' : '') +
  (d == 1 ? Math.abs(n) : `<span class=f><sup>${Math.abs(n)}</sup>⁄<sub>${d}</sub></span>`);
const leaf = (n, i) => ({ v: [n, 1], steps: [], i });
const is24 = x => x.v[0] == 24 && x.v[1] == 1;

// every result of combining two items (both directions); pair = the cards of the very first step
function* combos(x, y) {
  for (const [a, b] of [[x, y], [y, x]]) for (const [sym, f] of OPS) {
    const v = f(a.v, b.v);
    if (v) yield { v, pair: x.pair || y.pair || [x.i, y.i],
                   steps: [...x.steps, ...y.steps, `${fmt(a.v)} ${sym} ${fmt(b.v)} = ${fmt(v)}`] };
  }
}

// any solution at all, or undefined
function solve(items) {
  if (items.length == 1) return is24(items[0]) ? items[0] : undefined;
  for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
    const rest = items.filter((_, k) => k != i && k != j);
    for (const x of combos(items[i], items[j])) { const s = solve([x, ...rest]); if (s) return s; }
  }
}

// every result of the items kept in this order, any grouping
function groupings(items) {
  if (items.length == 1) return items;
  const out = [];
  for (let k = 1; k < items.length; k++)
    for (const l of groupings(items.slice(0, k))) for (const r of groupings(items.slice(k)))
      out.push(...combos(l, r));
  return out;
}

// tap order: the first two cards are combined first, the rest follow in order with any grouping
function checkOrder(items) {
  for (const x of combos(items[0], items[1])) {
    const hit = groupings([x, ...items.slice(2)]).find(is24);
    if (hit) return hit;
  }
}
// ---------- ui ----------
const $ = id => document.getElementById(id);
const TIME = 60;
let hand = [], picked = [], hint = [], solution, score = 0, left = TIME, done = false;

function deal() {
  const deck = [...Array(40)].map((_, i) => i % 10 + 1);
  hand = [...Array(4)].map(() => deck.splice(Math.random() * deck.length | 0, 1)[0]);
  start();
}
function start() {
  picked = []; hint = []; done = false; left = TIME;
  solution = solve(hand.map(leaf));
  $('steps').innerHTML = '';
  render();
}
function render() {
  $('time').textContent = `${left / 60 | 0}:${String(left % 60).padStart(2, '0')}`;
  $('score').textContent = `★ ${score}`;
  $('cards').classList.toggle('five', hand.length > 4);
  $('cards').innerHTML = hand.map((n, i) => {
    const p = picked.indexOf(i);
    return `<button class="card${i > 3 ? ' extra' : ''}${p >= 0 ? ' on' : ''}${hint.includes(i) ? ' hint' : ''}" data-i="${i}">${n}${p >= 0 ? `<i>${p + 1}</i>` : ''}</button>`;
  }).join('');
}
function finish(sol, win) {
  done = true; hint = [];
  $('steps').className = win ? 'win' : '';
  $('steps').innerHTML = sol.steps.map(s => `<div>${s}</div>`).join('');
  render();
}
function tap(i) {
  if (done) return;
  if (picked.includes(i)) { if (picked[picked.length - 1] == i) picked.pop(); return render(); }
  picked.push(i);
  if (picked.length == hand.length) {
    const sol = checkOrder(picked.map(i => leaf(hand[i], i)));
    if (sol) { score++; return finish(sol, true); }
    picked = [];
    $('cards').classList.add('no');
  }
  render();
}
function timeout() {
  if (solution) hint = solution.pair;                         // show the first step's two cards
  else if (hand.length == 4) { hand.push(1 + Math.random() * 10 | 0); return start(); } // 5th card, other deck
  else return deal();                                         // even 5 cards can't make 24
  render();
}

$('cards').onclick = e => { const b = e.target.closest('.card'); if (b) tap(+b.dataset.i); };
$('cards').onanimationend = () => $('cards').classList.remove('no');
$('undo').onclick = () => { if (!done) { picked.pop(); render(); } };
$('skip').onclick = () => done || !solution ? deal() : finish(solution, false);
// layout button cycles: 2×2 square → vertical column → single row
const LAYOUTS = ['sq', 'col', ''];
let layout = 0;
try { layout = +localStorage.layout || 0; } catch {}
const setLayout = () => { const c = $('cards').classList; c.remove('sq', 'col'); if (LAYOUTS[layout]) c.add(LAYOUTS[layout]); };
$('layout').onclick = () => { layout = (layout + 1) % 3; setLayout(); try { localStorage.layout = layout; } catch {} };
setLayout();
setInterval(() => { if (!done && left > 0) { left--; left ? render() : timeout(); } }, 1000);
deal();
</script>
